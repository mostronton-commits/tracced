# tracced — the draft site (dev.tracced.xyz). Same image, its own data and its own API
# key, so experiments never touch production or its quota. Runs the `dev` branch from /opt/tracced-dev.
#   docker compose -f compose.dev.yml up -d --build
name: tracced-dev
services:
  web:
    build: .
    container_name: tracced-dev-web
    env_file: .env
    environment:
      - WEB_PORT=8095
    volumes:
      - ./output:/app/output
      - ./cache:/app/cache
      - ./config.yaml:/app/config.yaml:ro
    networks: [proxy]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
