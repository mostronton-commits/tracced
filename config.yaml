# Tracced — settings. Anything under `early:` overrides tracced/early/settings.py DEFAULTS.

detect:                             # pump detector: suggested ranges on the chart
  interval: "5m"
  window_hours: 48                  # detect pumps within the first 48 h of a token
  accumulation_hours: 3             # accumulation range = this many hours before the breakout
  lookback: 24                      # candles for the base (24 × 5m = 2 h)
  pump_multiple: 2.0                # peak ≥ base × this = a pump
  breakout_ratio: 1.3               # pump starts where price > base × this
  min_peak_mcap: 1000000            # ignore pumps whose peak is below this market cap
  merge_gap_min: 60                 # pumps closer than this are one pump

early:
  plan: advanced                # owner, 27.10: Advanced, €50 for 200,000 requests a month, no rate limit (was Pro, 1,000,000). One call is one credit.
  private_hosts: [dev.tracced.xyz]   # owner, 30.09: the working copy opens for the owner's wallets only
  private_copy:                 # the working copy shares the Solana Tracker key with the site, so its background spends less:
    ready_lists_on: false       # no monthly count of the ready lists (production counts them; dev took 5,044 in October)
    token_images_backfill: false
    fresh_refresh_min: 60       # the home page's fresh pumps: hourly, not every 10 minutes
    fresh_max_refresh_per_day: 24
  demo_job: 98kfF7_20260915-1930_1950      # replays from output/early/demo/<mint>.json with zero requests (ignored if missing)

  # Cost of one new token. The entry range is always fetched in full (up to max_window_pages); exits come
  # either from the token's whole history (capped at max_trade_pages) or from each wallet's own trades
  # (1-4 requests per wallet) — the per-wallet path is where the credits go, so its cap is the main lever.
  # Budget: 200K a month is about 6,600 a day. One busy new token costs roughly a thousand requests.
  max_wallet_lookups: 2000      # was 250, which left 842 of 1,092 wallets without exits on the first trader's run
  max_window_hours: 6           # owner, 30.09: back from 24 — a 13.5 h range on a $56M token cost 1,114 requests and 2,418 Helius credits
  min_invested_usd: 20          # was 95, raised only to save credits — there is nothing to save now
  run_cap_requests: 2500        # owner, 27.10: was 6000 on Pro. Most runs take under 1,000; the rare busier one stops at the cap
  st_concurrency: 8             # wallets fetched at once (no rate limit on Advanced or Pro). Set 1 to go back to one by one

  # What the budget carries: about 5 runs × ~1000 requests = 5,000 a day, 1,000 for charts, the rest for the background.
  # The month is guarded by the real balance: /credits is asked at most every 10 minutes, and a live run by anyone
  # but the owner starts only while the balance minus run_cap_requests stays above 5% of the plan (the Advanced profile
  # sets credits_month 200,000 and credits_reserve_pct 5: 10,000 stay in reserve).
  credits_renew_day: 24         # the plan renews on this day of the month (bought on 24.09.2026); the owner's dashboard
                                # shows the date and whether the balance lasts until then. The API gives only the balance
  st_eur_per_million: 250       # Advanced costs €50 for 200,000 requests, so €250 a million: the dashboard turns requests per analysis into euros
  runs_per_day: 10              # per person (owner, 07.10: stays 10, «10 analyses a day for active wallets»): the wallet and the
                                # browser both count, so another wallet adds nothing
  runs_per_ip_per_day: 20       # per network: incognito plus a fresh wallet stops here; twice the person's, as an office or a phone carrier shares one address
  ready_lists_on: true          # owner, 07.10: ready lists on the home page. Last month's (owner, 08.10), counted on the 1st by the
                                # server's background: candidates from Solana Tracker's boards, their month counted by tracced
                                # like a wallet card, only wallets that trade like people; about 1,500 requests a month
  token_images_backfill: true   # owner, 07.10: token pictures in the home feed; older analyses read theirs once (1 request each)
  alerts_open: true             # owner, 05.10: Telegram alerts for every connected wallet, no longer a closed test
  runs_per_day_new_wallet: 3    # owner, 14.10: 3 while the hackathon judges try it (they come with fresh or empty wallets;
                                # the network cap still stands), back to 1 after the judging. Owner, 05.10: someone rotated fresh wallets to reset the count. A wallet younger than
                                # (owner, 07.10: the pages say only «for active wallets», never the exact rule, so nobody
                                # learns to farm one analysis per fresh wallet)
  new_wallet_days: 7            # new_wallet_days or holding under new_wallet_min_sol SOL gets this many a day; its age and
  new_wallet_min_sol: 0.01      # balance are read when it presses Analyze. Need more: the limit window offers the contact form
  refund_below_requests: 50     # a failed run gives its analysis back only if it spent fewer requests than this
  age_card_per_day: 50          # paid age/funder checks from wallet cards, per person a day (cached wallets are free)
  age_card_global_per_day: 500  # and for the whole site: one check can cost up to ~70 RPC credits
  runs_global_per_day: 100      # owner, 04.10 (was 40): the guards below still hold the cost, 5,000 requests a day and the month's reserve
  run_requests_per_day: 5000    # owner, 27.10: was 25,000 on Pro. The day in requests, not in runs: what finished runs spent plus the cap of every run
                                # in flight must fit, so a burst of runs at the 2,500 cap cannot spend a week of the plan in a day
  ranges_per_token: 5           # was 3

  # Charts of live tokens spend from the same budget (an overview is ~2 requests, a chunk of candles is 1).
  browse_per_day_guest: 100     # was 30
  browse_per_day: 600           # was 150
  browse_global_per_day: 1000   # was 4000 on Pro, 300 before

  # Wallet age and first funder (tags `fresh` and `bundle`) come from a Solana RPC, a product separate from the Data
  # API. SOLANA_RPC_URL in .env points at Helius (checked 24.09.2026: free plan, full history, 1 credit a call, and its
  # oldest-first method finds a busy wallet's first transaction in one call, where paging back took 37 pages). The
  # Helius account is shared with the owner's other bots, so tracced keeps to about 3 calls a second and its own share
  # of the month. Without SOLANA_RPC_URL the public api.mainnet-beta is used, which refuses long series (429).
  rpc_pace_s: 0.35              # about 3 calls a second: the free plan allows 10 for the whole account
  rpc_tx_pace_s: 0.35           # the same node answers the funder's transaction, so the same pace
  age_lookups_max: 200          # the first 200 by PnL, the wallets that made money on the token: the owner's call on
                                # 25.09.2026. Who funded the losers and the dust, and when they were born, nobody reads;
                                # any other wallet is checked when someone opens its card
  age_full_top: 200             # all of them get the full check: a busy wallet's real age (10 credits) and an app
                                # wallet's first SOL among its first 100 transactions (10); about 2,000 credits an analysis.
                                # Raising age_lookups_max above this gives the rest a one-credit check that keeps `fresh`
                                # exact but misses most bundles (measured on PAID: 3 of 86 wallets in bundles kept)
  rpc_credits_month: 250000     # tracced's share of the Helius month (1,000,000 for the whole account). About 2 credits
                                # a wallet, 11 for a busy one; age checks pause at 90% and resume next month

  # The owner's dashboard at /admin counts days in this zone (the daily caps above still reset at 00:00 UTC).
  usage_tz: Europe/Warsaw
