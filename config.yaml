# Tracced — settings. Anything under `early:` overrides tracced/early/settings.py DEFAULTS.

detect:                             # pump detector: suggested ranges on the chart
  interval: "5m"
  window_hours: 48                  # detect pumps within the first 48 h of a token
  accumulation_hours: 3             # accumulation range = this many hours before the breakout
  lookback: 24                      # candles for the base (24 × 5m = 2 h)
  pump_multiple: 2.0                # peak ≥ base × this = a pump
  breakout_ratio: 1.3               # pump starts where price > base × this
  min_peak_mcap: 1000000            # ignore pumps whose peak is below this market cap
  merge_gap_min: 60                 # pumps closer than this are one pump

early:
  plan: advanced                # Pro: 1 000 000 requests a month, no rate limit. One call is one credit.
  example_job: 98kfF7_20260915-1930_1950   # a finished analysis pinned as the example on the home page (ignored if missing)
  demo_job: 98kfF7_20260915-1930_1950      # replays from output/early/demo/<mint>.json with zero requests (ignored if missing)

  # Cost of one new token. The entry range is always fetched in full (up to max_window_pages); exits come
  # either from the token's whole history (capped at max_trade_pages) or from each wallet's own trades
  # (1-4 requests per wallet) — the per-wallet path is where the credits go, so its cap is the main lever.
  # Budget: 1M a month is about 33,000 a day. One busy new token costs roughly a thousand requests.
  max_wallet_lookups: 2000      # was 250, which left 842 of 1,092 wallets without exits on the first trader's run
  max_window_hours: 24          # was 6; the first trader reached for hours straight away
  min_invested_usd: 20          # was 95, raised only to save credits — there is nothing to save now
  run_cap_requests: 6000        # was 1000; the whole history of a busy token must not stop half way
  st_concurrency: 8             # wallets fetched at once (Pro has no rate limit). Set 1 to go back to one by one

  # What the budget carries: 20 runs × ~1000 requests = 20,000 a day, the rest stays for charts.
  # The month is guarded by the real balance: /credits is asked at most every 10 minutes, and a live run by anyone
  # but the owner starts only while the balance minus run_cap_requests stays above 5% of the plan (the Pro profile
  # sets credits_month 1,000,000 and credits_reserve_pct 5).
  runs_per_day: 5               # per person: the wallet and the browser both count, so another wallet adds nothing
  runs_per_ip_per_day: 10       # per network: incognito plus a fresh wallet stops here; above 5, as an office or a phone carrier shares one address
  refund_below_requests: 50     # a failed run gives its analysis back only if it spent fewer requests than this
  age_card_per_day: 50          # paid age/funder checks from wallet cards, per person a day (cached wallets are free)
  age_card_global_per_day: 500  # and for the whole site: one check can cost up to ~70 RPC credits
  runs_global_per_day: 40       # was 20 (owner, 24.09): a run costs ~100-350 requests on Pro, the month guard stays
  ranges_per_token: 5           # was 3

  # Charts of live tokens spend from the same budget (an overview is ~2 requests, a chunk of candles is 1).
  browse_per_day_guest: 100     # was 30
  browse_per_day: 600           # was 150
  browse_global_per_day: 4000   # was 300

  # Wallet age and first funder (tags `fresh` and `bundle`) come from a Solana RPC, a product separate from the Data
  # API. SOLANA_RPC_URL in .env points at Helius (checked 24.09.2026: free plan, full history, 1 credit a call, and its
  # oldest-first method finds a busy wallet's first transaction in one call, where paging back took 37 pages). The
  # Helius account is shared with the owner's other bots, so tracced keeps to about 3 calls a second and its own share
  # of the month. Without SOLANA_RPC_URL the public api.mainnet-beta is used, which refuses long series (429).
  rpc_pace_s: 0.35              # about 3 calls a second: the free plan allows 10 for the whole account
  rpc_tx_pace_s: 0.35           # the same node answers the funder's transaction, so the same pace
  age_lookups_max: 2000         # every wallet in the table, right after it appears (a server without SOLANA_RPC_URL
                                # keeps to the first 200 by PnL: the public node refuses series)
  rpc_credits_month: 250000     # tracced's share of the Helius month (1,000,000 for the whole account). About 2 credits
                                # a wallet, 11 for a busy one; age checks pause at 90% and resume next month
