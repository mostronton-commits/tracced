<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}tracced{% endblock %}</title>
<link rel="icon" href="/static/brand/icon.svg?v={{ v }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/brand/icon-180.png?v={{ v }}">
{% if umami_id %}<script defer src="https://cloud.umami.is/script.js" data-website-id="{{ umami_id }}"></script>{% endif %}
<link rel="stylesheet" href="/static/style.css?v={{ v }}">
<script src="/static/ui.js?v={{ v }}"></script>
<script src="/static/wallet.js?v={{ v }}" defer></script>
<script>
/* time zone preference: 'utc' (default) or 'local'; applied to every .dtc[data-ms] on the page and to the chart */
window.EarlyTZ = (function () {
  const KEY = 'early:tz'; let tz = 'utc';
  try { tz = localStorage.getItem(KEY) === 'local' ? 'local' : 'utc'; } catch (e) {}
  const M = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'], p = n => String(n).padStart(2, '0');
  function fmt(ms, long) {
    const d = new Date(+ms); if (!ms || isNaN(d)) return '—';
    const u = tz === 'utc';
    const mo = u ? d.getUTCMonth() : d.getMonth(), day = u ? d.getUTCDate() : d.getDate(), y = u ? d.getUTCFullYear() : d.getFullYear();
    const hh = u ? d.getUTCHours() : d.getHours(), mm = u ? d.getUTCMinutes() : d.getMinutes();
    return M[mo] + ' ' + day + (long ? ', ' + y + ' ' : ', ') + p(hh) + ':' + p(mm);   // no zone suffix: the footer switch already says which one is on
  }
  function apply() { document.querySelectorAll('.dtc[data-ms]').forEach(el => { if (+el.dataset.ms) el.textContent = fmt(el.dataset.ms, el.dataset.long === '1'); }); const b = document.getElementById('tz'); if (b) b.querySelectorAll('b').forEach((x, i) => x.classList.toggle('on', i === (tz === 'utc' ? 0 : 1))); }
  function toggle() { tz = tz === 'utc' ? 'local' : 'utc'; try { localStorage.setItem(KEY, tz); } catch (e) {} location.reload(); }
  document.addEventListener('DOMContentLoaded', apply);
  return { get: () => tz, fmt, apply, toggle };
})();
/* money unit: 'usd' (default) or 'sol'. Every amount carries both, so switching is a rewrite, not a conversion:
   the SOL figure is the one the swap actually moved. Results stored before the field existed have only dollars. */
window.EarlyCur = (function () {
  const KEY = 'early:cur'; let cur = 'usd';
  try { cur = localStorage.getItem(KEY) === 'sol' ? 'sol' : 'usd'; } catch (e) {}
  function sol(v) {
    const n = Math.abs(+v), s = v < 0 ? '-' : '';
    const d = n >= 100 ? 0 : n >= 10 ? 1 : n >= 1 ? 2 : 3;
    return s + '\u25CE' + n.toFixed(d);
  }
  function apply() {
    const on = cur === 'sol';
    document.querySelectorAll('.amt[data-usd]').forEach(el => {
      const v = el.dataset[on ? 'sol' : 'usd'];
      if (on && v === undefined) { el.classList.add('nosol'); el.title = 'This result was saved before tracced recorded SOL amounts'; return; }
      el.classList.remove('nosol'); el.removeAttribute('title');
      el.textContent = v === '' || v === undefined ? '\u2014' : (on ? sol(v) : el.dataset.usdText || el.textContent);
    });
    const b = document.getElementById('cur');
    if (b) b.querySelectorAll('b').forEach((x, i) => x.classList.toggle('on', i === (on ? 1 : 0)));
  }
  function toggle() { cur = cur === 'usd' ? 'sol' : 'usd'; try { localStorage.setItem(KEY, cur); } catch (e) {} location.reload(); }
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.amt[data-usd]').forEach(el => { el.dataset.usdText = el.textContent; });
    apply();
  });
  return { get: () => cur, sol, apply, toggle };
})();
</script>
{% block head %}{% endblock %}
</head>
<body>
{% block topbar %}<header class="top"><div class="top-in">
  <a class="brand" href="/">tracced</a>
  <form method="get" action="/token" class="topsearch">
    <input type="text" name="mint" placeholder="Token address" pattern="[1-9A-HJ-NP-Za-km-z]{32,44}" spellcheck="false" autocomplete="off" required>
  </form>
  <div class="right acct-slot">{% include "_acct.html" %}</div>
</div></header>{% endblock %}
{% block full %}{% endblock %}
<main class="{% block main_class %}{% endblock %}">
{% block body %}{% endblock %}
</main>
{% include "_wallet.html" %}
<footer class="foot"><div class="foot-in">
  <div class="foot-l"><b>tracced</b> <span class="muted mono">every wallet on the record</span></div>
  <div class="foot-c mono">◎ Built on Solana</div>
  <div class="foot-r muted small"><a href="/docs">Docs</a> · <button type="button" class="tzseg" id="tz" title="Time zone for all dates" aria-label="Time zone for all dates" onclick="EarlyTZ.toggle()"><b class="on">UTC</b><b>Local</b></button> ·
    <a class="ico" href="https://github.com/mostronton-commits/tracced" target="_blank" rel="noopener" aria-label="tracced on GitHub" title="GitHub"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M8 .2a8 8 0 0 0-2.5 15.6c.4 0 .5-.2.5-.4v-1.5c-2.2.5-2.7-1-2.7-1-.4-.9-.9-1.2-.9-1.2-.7-.5.1-.5.1-.5.8.1 1.2.8 1.2.8.7 1.3 1.9.9 2.4.7.1-.5.3-.9.5-1.1-1.8-.2-3.7-.9-3.7-4 0-.9.3-1.6.8-2.1-.1-.2-.4-1 .1-2.1 0 0 .7-.2 2.2.8a7.6 7.6 0 0 1 4 0c1.5-1 2.2-.8 2.2-.8.5 1.1.2 1.9.1 2.1.5.5.8 1.2.8 2.1 0 3.1-1.9 3.8-3.7 4 .3.3.6.8.6 1.5v2.2c0 .2.1.5.6.4A8 8 0 0 0 8 .2Z"/></svg></a>
    <a class="ico" href="https://x.com/tracced_xyz" target="_blank" rel="noopener" aria-label="tracced on X" title="X"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12.2 1.5h2.2L9.6 7l5.7 7.5h-4.5L7.3 9.9l-4 4.6H1.1l5.2-5.9L.8 1.5h4.6l3.2 4.2 3.6-4.2Zm-.8 11.7h1.2L4.7 2.7H3.4l8 10.5Z"/></svg></a>
    · <span class="mono" title="assets {{ v }}">v{{ version }}</span></div>
</div></footer>
</body>
</html>
