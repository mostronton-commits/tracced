{% extends "base.html" %}
{% block title %}Sign in · tracced{% endblock %}
{% block main_class %}center{% endblock %}
{% block topbar %}<header class="top"><div class="top-in"><a class="brand" href="/">tracced</a><span class="muted mono">every wallet on the record</span></div></header>{% endblock %}
{% block body %}
<section class="card narrow">
  <h2>Sign in</h2>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="row">
    <input type="password" name="password" placeholder="Password" autofocus>
    <button type="submit" class="primary">Enter</button>
  </form>
</section>
{% endblock %}
